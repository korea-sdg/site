# Jekyll configuration for Open SDG platform

# Tell the Remote Theme plugin to use the Open SDG platform (Jekyll theme).
remote_theme: open-sdg/open-sdg@2.3.0

# Replace this title as needed.
title: general.site_title
url: "/site"
environment: staging

baseurl: "/site"
remote_data_prefix: "https://korea-sdg.github.io/data/"

data_edit_url: http://prose.io/#korea-sdg/data/edit/develop/data/indicator_[id].csv

metadata_edit_url: http://prose.io/#korea-sdg/data/edit/develop/meta/[id].md

# Pages
collections:
  pages:
    output: true
    permalink: /:path/
  posts:
    output: true
    permalink: /news/:year/:month/:day/:title.html
  indicators:
    output: true
  goals:
    output: true

# Tell Jekyll to use the Remote Theme plugin.
plugins:
  - jekyll-remote-theme
  - jekyll-open-sdg-plugins

# Exclude some files/folders.
exclude:
  - vendor
  - scripts
  - remotedata
  - Gemfile
  - Gemfile.lock
  - README
  - README.md
  - LICENSE

